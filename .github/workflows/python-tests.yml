name: Variant 25 Python tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests
        run: python -m pytest -q
      - name: Test RPC via Hypothesis with branch coverage
        run: python -m coverage run --branch -m pytest -q tests/test_mbt_rpc.py
      - name: Show branch coverage
        run: python -m coverage report -m --include="src/*"
